<style>

(function(){

const TAU=Math.PI*2, V3=(x,y,z)=>new THREE.Vector3(x,y,z), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),
      lerp=(a,b,t)=>a+(b-a)*t, sm=t=>t*t*(3-2*t), eIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
      rad=d=>d*Math.PI/180;

/* ============================== PROCEDURAL TEXTURES ============================== */
function cv(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=8;return t;}
function genevaTex(){return cv(512,512,(g)=>{g.fillStyle='#909090';g.fillRect(0,0,512,512);g.save();g.translate(256,256);g.rotate(rad(-32));g.translate(-380,-380);
 for(let i=0;i<17;i++){const gr=g.createLinearGradient(i*46,0,i*46+46,0);gr.addColorStop(0,'#6f6f6f');gr.addColorStop(.12,'#b9b9b9');gr.addColorStop(.5,'#cfcfcf');gr.addColorStop(.88,'#b0b0b0');gr.addColorStop(1,'#666');g.fillStyle=gr;g.fillRect(i*46,0,46,780);}
 g.globalAlpha=.16;for(let i=0;i<260;i++){g.strokeStyle=Math.random()<.5?'#fff':'#333';g.beginPath();const x=Math.random()*800;g.moveTo(x,0);g.lineTo(x+40,780);g.stroke();}
 g.restore();});}

 const gr=g.createRadialGradient(x-6,y-6,2,x,y,r);gr.addColorStop(0,'#d6d6d6');gr.addColorStop(.72,'#a2a2a2');gr.addColorStop(1,'#5f5f5f');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();}});}
function trackTex(){const t=cv(1024,1024,(g)=>{g.fillStyle='#0d0f13';g.fillRect(0,0,1024,1024);const cx=512;

 for(let i=0;i<60;i++){const a=i/60*TAU,maj=i%5===0,r0=maj?461:468,r1=maj?513:506;g.lineWidth=maj?5:2.2;g.beginPath();g.moveTo(cx+Math.cos(a)*r0,cx+Math.sin(a)*r0);g.lineTo(cx+Math.cos(a)*r1,cx+Math.sin(a)*r1);g.stroke();}
 g.lineWidth=2;g.beginPath();g.arc(cx,cx,514,0,TAU);g.stroke();g.beginPath();g.arc(cx,cx,459,0,TAU);g.stroke();
 g.fillStyle='rgba(230,207,143,.85)';g.font='500 26px Manrope,sans-serif';g.textAlign='center';
 const mins=['','5','10','15','20','25','30','35','40','45','50','55'];
 for(let i=1;i<=12;i++){if(i===6)continue;const a=rad(90-i*30),x=cx+Math.cos(a)*432,y=cx-Math.sin(a)*432;g.fillText(mins[i],x,y+9);}
 });t.encoding=THREE.sRGBEncoding;t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;t.repeat.set(1/38,1/38);t.offset.set(.5,.5);return t;}
function plaqueTex(){const t=cv(512,224,(g)=>{g.clearRect(0,0,512,224);g.textAlign='center';g.fillStyle='#e3c887';
 g.font='600 92px "Cormorant Garamond",Georgia,serif';const word='AURUM',sp=118,x0=256-(word.length-1)*sp/2;
 for(let i=0;i<word.length;i++)g.fillText(word[i],x0+i*sp,108);
 g.fillStyle='#9b958a';g.font='300 27px Manrope,sans-serif';g.fillText('C A L I B R E   A X – 0 1',256,168);
 g.strokeStyle='rgba(201,162,75,.55)';g.lineWidth=2;g.beginPath();g.moveTo(96,196);g.lineTo(416,196);g.stroke();});
 t.encoding=THREE.sRGBEncoding;return t;}

 g.save();g.translate(512,512);g.scale(-1,1);const n=60;for(let i=0;i<n;i++){const ch=txt[i%txt.length];g.save();g.rotate(i/n*TAU);g.translate(0,-452);g.fillText(ch,0,0);g.restore();}g.restore();});
 t.encoding=THREE.sRGBEncoding;t.repeat.set(1/41.4,1/41.4);t.offset.set(.5,.5);return t;}
function radialTex(inner,mid){return cv(256,256,(g)=>{const gr=g.createRadialGradient(128,128,4,128,128,126);gr.addColorStop(0,inner);gr.addColorStop(.45,mid);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,256,256);});}

/* ============================== RENDERER / SCENE ============================== */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});

/* --- studio environment --- */
(function(){
 const env=new THREE.Scene();
 const panel=(w,h,col,k,x,y,z)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(col).multiplyScalar(k),side:THREE.DoubleSide}));m.position.set(x,y,z);m.lookAt(new THREE.Vector3());env.add(m);};
 env.add(new THREE.Mesh(new THREE.SphereGeometry(80,16,8),new THREE.MeshBasicMaterial({color:0x0a0b0d,side:THREE.BackSide})));
 panel(70,26,0xfff4e2,7,0,58,4);
 panel(9,55,0xcfe2ff,4.5,-56,18,10);
 panel(9,55,0xffe6c4,3.2,56,16,6);

 panel(50,50,0x30343c,.8,0,-40,-30);

 scene.environment=pm.fromScene(env,0.045).texture;pm.dispose();
})();

const key=new THREE.SpotLight(0xfff1dd,1.5,0,.55,.65,1);
key.position.set(36,66,42);key.castShadow=true;key.shadow.mapSize.set(2048,2048);
key.shadow.bias=-.00018;key.shadow.normalBias=.03;key.shadow.camera.near=20;key.shadow.camera.far=180;
scene.add(key);key.target.position.set(0,26,0);scene.add(key.target);
const rim=new THREE.DirectionalLight(0xbdd2ff,.75);rim.position.set(-46,26,-38);scene.add(rim);
const fill=new THREE.PointLight(0xffd9ae,.4,0,2);fill.position.set(-26,12,40);scene.add(fill);

scene.add(new THREE.Mesh(new THREE.SphereGeometry(420,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,
 vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',

const dust=(function(){const n=150,pos=new Float32Array(n*3);for(let i=0;i<n;i++){const r=34+Math.random()*80,a=Math.random()*TAU,y=4+Math.random()*60;pos[i*3]=Math.cos(a)*r;pos[i*3+1]=y;pos[i*3+2]=Math.sin(a)*r;}
 const ge=new THREE.BufferGeometry();ge.setAttribute('position',new THREE.BufferAttribute(pos,3));
 const m=new THREE.Points(ge,new THREE.PointsMaterial({size:1.1,map:radialTex('rgba(255,240,210,1)','rgba(255,240,210,.35)'),transparent:true,opacity:.4,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true}));

/* --- reflective floor --- */
const RT=new THREE.WebGLRenderTarget(2,2,{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter});
const vcam=new THREE.PerspectiveCamera();

 sh.uniforms.tRefl={value:RT.texture};sh.uniforms.uStr={value:.62};

/* ============================== MATERIALS ============================== */
const bumpG=genevaTex(),bumpP=perlageTex();bumpG.repeat.set(1/13,1/13);bumpG.offset.set(.5,.5);bumpP.repeat.set(1/6,1/6);bumpP.offset.set(.5,.5);

/* ============================== PART REGISTRY ============================== */
const PARTS={},ORDER=['crystal','bezel','handsH','handsM','handsS','chapter','case','crown','caseback','mainplate','barrelBridge','trainBridge','balanceCock','barrel','centerWheel','thirdWheel','fourthWheel','escapeWheel','palletFork','balance','hairspring','jewels'];

const pickMeshes=[],matCache={};
function reg(m,pid,canHL){m.userData.pid=pid;

const INFO={
 _ov:{kick:'Manufacture squelette',name:'Calibre AX-01',rows:[['Calibre','AX-01 · 15.3 lignes'],['Frequency','28,800 vph · 4 Hz'],['Jewels','26, in gold chatons'],['Power reserve','≈ 46 hours'],['Winding','Manual, via crown']],desc:'An open-hearted manufacture movement: every bridge, wheel and ruby is deliberately exposed. Drag to admire the architecture, press Explode to lift the watch apart layer by layer, and hover any component to identify it. The escapement beats eight times a second — listen with Tick.'},

/* ============================== GEOMETRY FACTORIES ============================== */
function gearGeo(o){const{teeth,rp,thick,bore=.5,tooth=.3,spokes=0,hub=1.1,rim=.85}=o;
 const tip=rp+tooth,root=rp-tooth*.9,st=TAU/teeth,s=new THREE.Shape();
 for(let i=0;i<teeth;i++){const a=i*st,p=[[root,a],[root,a+st*.24],[tip,a+st*.34],[tip,a+st*.56],[root,a+st*.66]];
  p.forEach((q,j)=>{const x=Math.cos(q[1])*q[0],y=Math.sin(q[1])*q[0];(i===0&&j===0)?s.moveTo(x,y):s.lineTo(x,y);});}
 s.closePath();addBore(s,bore);if(spokes)addSpokes(s,spokes,hub,root-rim);
 const g=new THREE.ExtrudeGeometry(s,{depth:thick,bevelEnabled:true,bevelThickness:.05,bevelSize:.05,bevelSegments:1,curveSegments:18});
 g.translate(0,0,-thick/2);return g;}
function addBore(s,r){const h=new THREE.Path();h.absarc(0,0,r,0,TAU,true);s.holes.push(h);}
function addSpokes(s,n,hub,outR){if(outR-hub<1)return;const ri=hub+.3,ro=outR-.15,rm=(ri+ro)/2,w=Math.min(TAU/n*rm*.42,1.5);
 for(let k=0;k<n;k++){const a=(k+.5)/n*TAU,h=new THREE.Path();h.absellipse(Math.cos(a)*rm,Math.sin(a)*rm,(ro-ri)/2*.8,w/2,0,TAU,true,a+Math.PI/2);s.holes.push(h);}}
function escapeGeo(rp,thick){const N=15,st=TAU/N,s=new THREE.Shape();
 for(let i=0;i<N;i++){const a=i*st,p=[[rp,a],[rp*.88,a+st*.30],[rp*.60,a+st*.36],[rp*.57,a+st*.60]];
  p.forEach((q,j)=>{const x=Math.cos(q[1])*q[0],y=Math.sin(q[1])*q[0];(i===0&&j===0)?s.moveTo(x,y):s.lineTo(x,y);});}
 s.closePath();addBore(s,.4);addSpokes(s,4,.75,rp*.55);
 const g=new THREE.ExtrudeGeometry(s,{depth:thick,bevelEnabled:true,bevelThickness:.04,bevelSize:.04,bevelSegments:1,curveSegments:10});
 g.translate(0,0,-thick/2);return g;}
function plateGeo(pts,holes,opt={}){const s=new THREE.Shape();s.moveTo(pts[0][0],pts[0][1]);
 s.splineThru(pts.slice(1).map(p=>new THREE.Vector2(p[0],p[1])));s.closePath();
 (holes||[]).forEach(h=>{const p=new THREE.Path();p.absarc(h[0],h[1],h[2],0,TAU,true);s.holes.push(p);});
 const d=opt.depth||.7,g=new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:true,bevelThickness:.1,bevelSize:.1,bevelSegments:2,curveSegments:24});
 g.translate(0,0,-d/2);return g;}
function ringShapeGeo(r0,r1,holes,depth){const s=new THREE.Shape();s.absarc(0,0,r1,0,TAU,false);
 const h0=new THREE.Path();h0.absarc(0,0,r0,0,TAU,true);s.holes.push(h0);
 (holes||[]).forEach(h=>{const p=new THREE.Path();p.absarc(h[0],h[1],h[2],0,TAU,true);s.holes.push(p);});
 const g=new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:true,bevelThickness:.03,bevelSize:.03,bevelSegments:1,curveSegments:96});return g;}
/* FIX ⑦: lathe profiles revolve around Y, but the watch axis is Z —
   bake a +90° X-rotation into every lathe geometry so +Y(profile height) → +Z(front).
   This aligns case middle / bezel / caseback / spacer / crystal dome with the movement. */
function lathe(pts,seg,mat){const g=new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),seg||96);
 g.rotateX(Math.PI/2);return new THREE.Mesh(g,mat);}
function handGeo(len,wb,tl,rx,cy,ry){const s=new THREE.Shape();
 s.moveTo(-wb/2,-tl);s.lineTo(-wb*.46,len*.42);s.lineTo(-wb*.16,len);s.lineTo(wb*.16,len);s.lineTo(wb*.46,len*.42);s.lineTo(wb/2,-tl);s.closePath();
 const h=new THREE.Path();h.absellipse(0,cy,rx,ry,0,TAU,true);s.holes.push(h);
 const g=new THREE.ExtrudeGeometry(s,{depth:.26,bevelEnabled:true,bevelThickness:.04,bevelSize:.04,bevelSegments:1,curveSegments:16});g.translate(0,0,-.13);return g;}
function spiralGeo(turns,r0,r1,tube){const pts=[];for(let i=0;i<=240;i++){const t=i/240,th=t*turns*TAU,r=r0+(r1-r0)*t;pts.push(V3(Math.cos(th)*r,Math.sin(th)*r,0));}
 return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),300,tube,6,false);}

class Orbit{constructor(cam,dom,target){
 this.cam=cam;this.dom=dom;this.target=target.clone();
 this.cur={r:150,t:.4636,p:1.34};this.d={t:0,p:0};
 this.minR=30;this.maxR=170;this.minP=.14;this.maxP=1.46;this.auto=false;this.spd=.14;
 const pts=new Map();let lx=0,ly=0,pinch=0;
 dom.addEventListener('pointerdown',e=>{pts.set(e.pointerId,e);if(pts.size===1){lx=e.clientX;ly=e.clientY;dom.classList.add('drag');}
  if(pts.size===2){const a=[...pts.values()];pinch=Math.hypot(a[0].clientX-a[1].clientX,a[0].clientY-a[1].clientY);}
  dom.setPointerCapture(e.pointerId);});
 dom.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId)){return;}pts.set(e.pointerId,e);
  if(pts.size===1){const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;this.d.t-=dx*.0052;this.d.p-=dy*.0052;}
  else if(pts.size===2){const a=[...pts.values()];const d=Math.hypot(a[0].clientX-a[1].clientX,a[0].clientY-a[1].clientY);
   if(pinch>0)this.cur.r=clamp(this.cur.r*pinch/d,this.minR,this.maxR);pinch=d;}});
 const up=e=>{pts.delete(e.pointerId);if(!pts.size)dom.classList.remove('drag');pinch=0;};
 dom.addEventListener('pointerup',up);dom.addEventListener('pointercancel',up);
 dom.addEventListener('wheel',e=>{e.preventDefault();this.cur.r=clamp(this.cur.r*Math.pow(1.0014,e.deltaY),this.minR,this.maxR);},{passive:false});}
 update(dt){if(this.auto&&!dragging)this.cur.t+=this.spd*dt;
  this.cur.t+=this.d.t;this.cur.p+=this.d.p;
  const dec=Math.exp(-dt*7);this.d.t*=dec;this.d.p*=dec;
  this.cur.p=clamp(this.cur.p,this.minP,this.maxP);this.cur.r=clamp(this.cur.r,this.minR,this.maxR);
  const sp=new THREE.Spherical(this.cur.r,this.cur.p,this.cur.t);
  this.cam.position.setFromSpherical(sp).add(this.target);this.cam.lookAt(this.target);}}

(function(){const kids=trainAsm.children.filter(o=>o.isMesh);

function mech(t){
 const ph=t*TAU/.25;
 balWheel.rotation.z=AMP*Math.sin(ph);
 hairspring.scale.set(1+.05*Math.sin(ph),1+.05*Math.sin(ph),1);
 palletAsm.rotation.z=rad(42.8)+.16*Math.tanh(Math.sin(ph-1.9)*2.6);
 const b=Math.floor(t/BEAT);
 if(b!==lastBeat){lastBeat=b;if(sndOn&&AC)tickSnd();}
 const fr=Math.min(1,(t-b*BEAT)/.035),ez=1-Math.pow(1-fr,3);
 trainParts.escape.rotation.z=-(b+ez)*STEP;
 trainParts.fourth.rotation.z=-t*TAU/60;
 trainParts.third.rotation.z=t*TAU/480;
 trainParts.center.rotation.z=-t*TAU/3600;
 if(barrelParts.drum)barrelParts.drum.rotation.z=t*TAU/420;
 const n=new Date();
 const sq=Math.floor((n.getTime()%60000)/125)*125;
 secH.rotation.z=-(sq/1000)/60*TAU;
 minH.rotation.z=-((n.getMinutes()+(n.getSeconds()+n.getMilliseconds()/1000)/60)/60)*TAU;
 hourH.rotation.z=-(((n.getHours()%12)+n.getMinutes()/60+n.getSeconds()/3600)/12)*TAU;}

 el.style.opacity=.95;el.style.left=((tmpV.x*.5+.5)*innerWidth)+'px';el.style.top=((-tmpV.y*.5+.5)*innerHeight)+'px';});}

/* ============================== REFLECTION PASS ============================== */
function reflect(){floor.visible=false;contact.visible=false;
 vcam.fov=camera.fov;vcam.aspect=camera.aspect;vcam.near=camera.near;vcam.far=camera.far;vcam.updateProjectionMatrix();
 vcam.position.set(camera.position.x,-camera.position.y,camera.position.z);
 vcam.up.set(0,-1,0);
 vcam.lookAt(orbit.target.x,-orbit.target.y,orbit.target.z);
 renderer.setRenderTarget(RT);renderer.render(scene,vcam);renderer.setRenderTarget(null);
 floor.visible=true;contact.visible=true;}

/* ============================== MAIN LOOP ============================== */
const clk=new THREE.Clock();let elT=0;
function loop(){requestAnimationFrame(loop);
 const dt=clamp(clk.getDelta(),0,.05);elT+=dt;
 twStep();orbit.update(dt);
 watchRoot.position.y=26+Math.sin(elT*.6)*.7;
 tiltG.rotation.z=Math.sin(elT*.4)*.012;
 tiltG.rotation.x=-.1+Math.sin(elT*.53)*.01;
 mech(elT);explUpdate(dt);
 dust.rotation.y+=dt*.012;
 if(hovPid&&hovPid!==selPid)hiApply(hovPid,false,0);
 if(selPid)hiApply(selPid,true,.18*Math.sin(elT*5));
 Object.keys(PARTS).forEach(k=>{if(k!==hovPid&&k!==selPid)hiClear(k);});
 reflect();
 renderer.render(scene,camera);
 labUpdate();}
loop();

/* ============================== RESIZE / BOOT ============================== */
function resize(){const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();
 renderer.setSize(w,h);const s=Math.min(1600,Math.floor(w*Math.min(devicePixelRatio,1.75)*.5));
 RT.setSize(s,Math.floor(s*h/w));}
resize();addEventListener('resize',resize);
setTimeout(()=>{const l=document.getElementById('loader');l.style.opacity=0;setTimeout(()=>l.remove(),950);},650);
})();
</script>
</body>
