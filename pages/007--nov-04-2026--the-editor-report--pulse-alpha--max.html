let THEME = (() => {
  try {
    const q = new URLSearchParams(location.search).get('theme');
    if (q && THEMES[q]) return q;
    const s = localStorage.getItem('size-report-theme');
    if (s && THEMES[s]) return s;
  } catch (e) {}
  return 'nova';
})();
let TH = THEMES[THEME];
const rgbA = (rgb, a) => `rgba(${rgb},${a})`;
const inkA = a => rgbA(TH.inkRGB, a);
const dimA = a => rgbA(TH.dimRGB, a);
const panelA = a => rgbA(TH.panelRGB, a);
const gridA = a => rgbA(TH.gridRGB, a);
const particleA = a => rgbA(TH.particleRGB, a);
const hexToRgb = h => { const n = parseInt(h.slice(1), 16); return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`; };
const hexA = (hex, a) => rgbA(hexToRgb(hex), a);
const a1A = a => rgbA(hexToRgb(TH.a1), a);
const a2A = a => rgbA(hexToRgb(TH.a2), a);
const a3A = a => rgbA(hexToRgb(TH.a3), a);
const a4A = a => rgbA(hexToRgb(TH.a4), a);
const blueA = a => rgbA(hexToRgb(TH.blue), a);
const hotA = a => rgbA(hexToRgb(TH.hot), a);
function applyTheme(name, persist){
  THEME = name; TH = THEMES[name];
  const scanEl = document.getElementById('scan');
  if (scanEl) scanEl.style.opacity = String(TH.scan);
  const wrap = document.getElementById('stage-wrap');
  if (wrap) wrap.style.boxShadow = name === 'paper' ? '0 0 60px rgba(31,78,121,.25), 0 30px 80px rgba(28,26,23,.35)'
    : name === 'terminal' ? '0 0 70px rgba(51,255,102,.18), 0 0 160px rgba(51,255,102,.07)'
    : name === 'pop' ? '0 0 0 6px #141414, 0 24px 60px rgba(20,20,20,.4)'
    : name === 'noir' ? '0 0 80px ' + inkA(.09) + ', 0 0 200px rgba(0,0,0,.9)'
    : '0 0 90px a1A(.10), 0 0 220px a2A(.06)';
  document.body.className = (document.body.className || '').replace(/\btheme-\w+\b/g, '').trim();
  document.body.classList.add('theme-' + name);
  if (persist !== false) { try { localStorage.setItem('size-report-theme', name); } catch (e) {} }
  document.querySelectorAll('#themeToggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.theme === name);
    b.setAttribute('aria-pressed', b.dataset.theme === name ? 'true' : 'false');
  });
}

const VS = DATA.vscode;
const T_START = D2('2017-05-01'), T_END = D2('2026-12-15');
const CH = { x: 88, yTop: 170, yBot: 640, w: 1150 };
const yOf = v => CH.yBot - (v / 280) * (CH.yBot - CH.yTop);
const xOf = t => CH.x + (t - T_START) / (T_END - T_START) * CH.w;

function drawLineChart(lt, cfg){
  // gridlines + y labels
  [0, 50, 100, 150, 200, 250].forEach(v => {
    dashedLine(CH.x, yOf(v), CH.x + CH.w, yOf(v), [5, 7], gridA(.14), 1);
    txt(String(v), CH.x - 14, yOf(v) + 5, { size:15, color:dimA(.65), align:'right', font:TH.fonts.mono, weight:600 });
  });
  txt('MB', CH.x - 14, CH.yTop - 12, { size:12, color:dimA(.7), align:'right', ls:2 });
  // x ticks 2017..2026
  for (let y = 2017; y <= 2026; y++){
    const X = xOf(D2(y + '-01-01'));
    ctx.strokeStyle = gridA(.25); ctx.lineWidth = 1.5;
    line(X, CH.yBot, X, CH.yBot + 8);
    txt(String(y), clamp(X, CH.x + 20, CH.x + CH.w - 20), CH.yBot + 30, { size:15, color:dimA(.65), align:'center', font:TH.fonts.mono, weight:600 });
  }
  // 2026 shaded band
  const bx = xOf(D2('2026-01-01'));
  ctx.fillStyle = a3A(.07); ctx.fillRect(bx, CH.yTop, CH.x + CH.w - bx, CH.yBot - CH.yTop);
  txt('2026', (bx + CH.x + CH.w) / 2, CH.yBot - 14, { size:15, weight:800, color:a3A(.7), align:'center', ls:4 });

  // reveal
  const reveal = easeInOut(seg(lt, 1.0, 23));
  const lineEndX = CH.x + CH.w * reveal;

  // area + line (clipped)
  ctx.save();
  ctx.beginPath(); ctx.rect(CH.x - 4, 0, lineEndX - CH.x + 8, H); ctx.clip();
  // area
  ctx.beginPath();
  ctx.moveTo(xOf(D2(VS[0].date)), yOf(VS[0].mb));
  for (const p of VS) ctx.lineTo(xOf(D2(p.date)), yOf(p.mb));
  ctx.lineTo(xOf(D2(VS[VS.length - 1].date)), CH.yBot); ctx.lineTo(xOf(D2(VS[0].date)), CH.yBot); ctx.closePath();
  const ag = ctx.createLinearGradient(0, CH.yTop, 0, CH.yBot);
  ag.addColorStop(0, a1A(.32)); ag.addColorStop(.65, blueA(.08)); ag.addColorStop(1, blueA(0));
  ctx.fillStyle = ag; ctx.fill();
  // line
  ctx.beginPath();
  ctx.moveTo(xOf(D2(VS[0].date)), yOf(VS[0].mb));
  for (const p of VS) ctx.lineTo(xOf(D2(p.date)), yOf(p.mb));
  const lg = ctx.createLinearGradient(CH.x, 0, CH.x + CH.w, 0);
  lg.addColorStop(0, TH.a1); lg.addColorStop(.55, TH.blue); lg.addColorStop(.8, TH.a3); lg.addColorStop(1, TH.hot);
  ctx.save();
  ctx.strokeStyle = lg; ctx.lineWidth = 4.5; ctx.lineJoin = 'round'; ctx.shadowColor = a1A(.7); ctx.shadowBlur = 14;
  ctx.stroke(); ctx.restore();
  ctx.restore();

  // leading edge glow dot
  if (reveal > 0 && reveal < 1){
    const tx = T_START + (T_END - T_START) * reveal;
    // find nearest point for y
    let y = null;
    for (let i = 0; i < VS.length - 1; i++){
      const a = D2(VS[i].date), b = D2(VS[i + 1].date);
      if (tx >= a && tx <= b){ y = lerp(VS[i].mb, VS[i + 1].mb, (tx - a) / (b - a)); break; }
    }
    if (y != null){ glowSpot(lineEndX, yOf(y), 34, a1A(.8)); circle(lineEndX, yOf(y), 6, TH.hiInk); }
  }

  // milestone flags (spread out ones only)
  const flags = [
    { date:'2019-02-01', v:'1.32', mb:50, row:0 },
    { date:'2021-04-01', v:'1.56', mb:80, row:1 },
    { date:'2024-05-01', v:'1.90', mb:100, row:0 }
  ];
  for (const f of flags){
    const X = xOf(D2(f.date)), Y = yOf(f.mb);
    if (X > lineEndX + 2) continue;
    dashedLine(X, Y, X, CH.yBot, [4, 5], blueA(.35), 1);
    circle(X, Y, 5, TH.a1Lt);
    const py = CH.yTop + 10 + f.row * 40;
    chip(X - 76, py, 152, 30, a1A(.10), a1A(.4));
    txt(`${f.v} · ${f.mb} MB`, X, py + 21, { size:15, weight:700, color:TH.a1Lt, align:'center', font:TH.fonts.mono });
  }

  // final point
  const fx = xOf(D2(VS[VS.length - 1].date)), fy = yOf(VS[VS.length - 1].mb);
  if (reveal >= 0.985){
    const pulse = .5 + .5 * Math.sin(lt * 4);
    ring(fx, fy, 12 + pulse * 6, hotA(.9), 2.5, 16);
    circle(fx, fy, 6.5, TH.hotLt);
    chip(fx - 218, fy - 58, 206, 36, hotA(.16), hotA(.6));
    txt('1.145 · 256.3 MB', fx - 115, fy - 34, { size:17, weight:800, color:TH.hotLt, align:'center', font:TH.fonts.mono });
  }
  // baseline
  ctx.strokeStyle = gridA(.3); ctx.lineWidth = 2; line(CH.x, CH.yBot, CH.x + CH.w, CH.yBot);
}

function miniChart(cfg){
  const { x, yTop, yBot, w, yMin, yMax } = cfg;
  const yOf2 = v => yBot - (v - yMin) / (yMax - yMin) * (yBot - yTop);
  const xOf2 = t => x + (t - Z_START) / (Z_END - Z_START) * w;
  cfg.grid.forEach(v => {
    dashedLine(x, yOf2(v), x + w, yOf2(v), [5, 7], cfg.gridColor, 1);
    txt(String(v), x - 10, yOf2(v) + 5, { size:13, color: cfg.gridLabel, align:'right', font:TH.fonts.mono, weight:600 });
  });
  for (let m = 0; m <= 13; m += 2){
    const d = new Date(2025, 9 + m, 1);
    const X = xOf2(D2(`${d.getFullYear()}-${pad2(d.getMonth() + 1)}-01`));
    if (X > x + w + 4) break;
    txt(`${d.getFullYear()}-${pad2(d.getMonth() + 1)}`, X, yBot + 24, { size:12, color: cfg.gridLabel, align:'center', font:TH.fonts.mono });
  }
  return { yOf2, xOf2 };
}

function iconLayers(cx, cy, s, color){
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.shadowColor = color; ctx.shadowBlur = 14; ctx.lineJoin = 'round';

    ctx.globalAlpha = .45 + i * .28; ctx.stroke();
  }
  ctx.restore();
}
function iconPackage(cx, cy, s, color){
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.shadowColor = color; ctx.shadowBlur = 14; ctx.lineJoin = 'round';
  ctx.strokeRect(cx - s * .8, cy - s * .55, s * 1.6, s * 1.15);

  ctx.beginPath(); ctx.moveTo(cx - s * .26, cy + s * .14); ctx.lineTo(cx + s * .26, cy + s * .14); ctx.stroke();

}
function iconGauge(cx, cy, s, color){
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.shadowColor = color; ctx.shadowBlur = 14; ctx.lineCap = 'round';

}

      const x = 960 - total / 2 + i * (pw + gap), y = 856, ph = 46;
      rrect(x, y, pw, ph, 23);
      ctx.fillStyle = i === 1 ? a3A(.14) : a1A(.10); ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = i === 1 ? a3A(.6) : a1A(.5); ctx.stroke();
      txt(s, x + pw / 2, y + 30, { size:18, weight:700, color: i === 1 ? TH.a3Lt : TH.a1Lt, align:'center', ls:6 });
    });
    mono(T('otNext'), 960, 950, { size:14, color:dimA(.6), align:'center', ls:2 });
    ctx.restore();
  }
  // fade to black at the very end
  const fade = seg(lt, dur - 2.2, dur - .2);
  if (fade > 0){ ctx.fillStyle = `rgba(2,6,23,${(fade * .92).toFixed(3)})`; ctx.fillRect(0, 0, W, H); }
}
</script>
<script>
/* ================= DISPATCHER & PLAYER ================= */
const RENDER = {
  intro: drawIntro, method: drawMethod, timeline: drawTimeline, spike: drawSpike,
  zed: drawZed, why: drawWhy, board: drawBoard, outro: drawOutro
};
function draw(t){
  t = clamp(t, 0, TOTAL - 1e-4);
  drawBackground(t);
  const sc = SCENES.find(s => t >= s.t0 && t < s.t1) || SCENES[SCENES.length - 1];
  RENDER[sc.id](t - sc.t0, sc.t1 - sc.t0, t);
  drawChrome(t, sc);
}
window.__renderAt = t => draw(t);
window.__TOTAL = TOTAL;

const audio = document.getElementById('narr');
const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
const muteBtn = document.getElementById('muteBtn');
const volIcon = document.getElementById('volIcon');
const fsBtn = document.getElementById('fsBtn');
const timeLabel = document.getElementById('timeLabel');
const seek = document.getElementById('seek');
const seekFill = document.getElementById('seekFill');
const seekTrack = document.getElementById('seekTrack');
const controls = document.getElementById('controls');
const docTitleMain = document.getElementById('docTitleMain');
const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
const ICON_PAUSE = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
const ICON_VOL = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/>';
const ICON_MUTE = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3l2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4-2.7-2.7z"/>';

// chapter dots
const chapterDots = [];
function renderChapters(){
  chapterDots.forEach(d => d.remove());
  chapterDots.length = 0;
  for (const sc of SCENES){
    const dot = document.createElement('div');
    dot.className = 'chap';
    dot.style.left = (sc.t0 / TOTAL * 100) + '%';
    dot.title = `${SCENE_NAMES[sc.id] || sc.id} · ${mmss(sc.t0)}`;
    dot.addEventListener('click', ev => { ev.stopPropagation(); seekTo(sc.t0 + 0.001); });
    seekTrack.appendChild(dot);
    chapterDots.push(dot);
  }
}
const langSel = document.getElementById('langSelect');
function applyLangUI(){
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  docTitleMain.textContent = I18N[LANG].docTitle;
  if (langSel) langSel.value = LANG;
}
function setLang(l){
  if (l === LANG || (l !== 'en' && l !== 'zh')) return;
  LANG = l;
  SCENE_NAMES = I18N[LANG].sceneNames;
  try { localStorage.setItem('size-report-lang', l); } catch (e) {}
  applyLangUI();
  renderChapters();
  if (!isPlaying()) draw(audio.currentTime || 0);
}
if (langSel){
  langSel.value = LANG;
  langSel.addEventListener('change', () => setLang(langSel.value));
}
renderChapters();
applyLangUI();

const themeSel = document.getElementById('themeSelect');
function setTheme(name){
  if (!THEMES[name] || name === THEME) return;
  applyTheme(name, true);
  if (themeSel) themeSel.value = name;
  if (!isPlaying()) draw(audio.currentTime || 0);
}
if (themeSel){
  themeSel.value = THEME;
  themeSel.addEventListener('change', () => setTheme(themeSel.value));
}
applyTheme(THEME, false);
function isPlaying(){ return !audio.paused && !audio.ended; }
function syncPlayIcon(){ playIcon.innerHTML = isPlaying() ? ICON_PAUSE : ICON_PLAY; }
function seekTo(t){
  audio.currentTime = clamp(t, 0, TOTAL - 0.001);
  draw(audio.currentTime);
  updateSeekUI();
}
function updateSeekUI(){
  const t = clamp(audio.currentTime || 0, 0, TOTAL);
  seekFill.style.width = (t / TOTAL * 100) + '%';
  timeLabel.textContent = `${mmss(t)} / ${mmss(TOTAL)}`;
}
playBtn.addEventListener('click', () => { isPlaying() ? audio.pause() : audio.play(); syncPlayIcon(); });
muteBtn.addEventListener('click', () => { audio.muted = !audio.muted; volIcon.innerHTML = audio.muted ? ICON_MUTE : ICON_VOL; });
fsBtn.addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.getElementById('stage-wrap').requestFullscreen().catch(() => {});
});
seek.addEventListener('click', ev => {
  const r = seekTrack.getBoundingClientRect();
  seekTo((ev.clientX - r.left) / r.width * TOTAL);
});
audio.addEventListener('ended', () => { syncPlayIcon(); draw(TOTAL - 0.001); });
audio.addEventListener('play', syncPlayIcon);
audio.addEventListener('pause', syncPlayIcon);
document.addEventListener('keydown', ev => {
  if (ev.code === 'Space'){ ev.preventDefault(); playBtn.click(); }
  else if (ev.code === 'ArrowRight'){ seekTo((audio.currentTime || 0) + 5); }
  else if (ev.code === 'ArrowLeft'){ seekTo((audio.currentTime || 0) - 5); }
  else if (ev.key === 'm' || ev.key === 'M'){ muteBtn.click(); }
  else if (ev.key === 'f' || ev.key === 'F'){ fsBtn.click(); }
  else if (ev.key === 'l' || ev.key === 'L'){ setLang(LANG === 'en' ? 'zh' : 'en'); }
  else if (ev.key >= '1' && ev.key <= '5'){ setTheme(['nova', 'paper', 'terminal', 'pop', 'noir'][Number(ev.key) - 1]); }
});
let hideTimer = 0;
let controlsActivated = false;
const stageWrap = document.getElementById('stage-wrap');

function showControls(){
  controls.classList.remove('hidden');
  controls.classList.add('pinned');
  clearTimeout(hideTimer);
}

function scheduleHide(){
  if (!controlsActivated) return;
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    if (!controls.matches(':hover')) {
      controls.classList.add('hidden');
      controls.classList.remove('pinned');
    }
  }, 1200);
}

stageWrap.addEventListener('mousemove', (e) => {
  if (!controlsActivated) {
    showControls();
    clearTimeout(hideTimer);
    return;
  }
  const rect = controls.getBoundingClientRect();
  if (e.clientY >= rect.top - 8) {
    showControls();
    scheduleHide();
  } else {
    if (!controls.matches(':hover')) {
      controls.classList.add('hidden');
      controls.classList.remove('pinned');
    }
  }
});

controls.addEventListener('mouseenter', () => {
  if (!controlsActivated) {
    controlsActivated = true;
  }
  showControls();
  clearTimeout(hideTimer);
  if (controlsActivated) {
    scheduleHide();
  }
});

controls.addEventListener('mouseleave', () => {
  if (!controlsActivated) return;
  scheduleHide();
});

if (new URLSearchParams(location.search).has('capture')) document.body.classList.add('capture');

function frame(){
  if (isPlaying()){ draw(audio.currentTime); updateSeekUI(); }
  requestAnimationFrame(frame);
}
draw(0);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!isPlaying()) draw(audio.currentTime || 0); });
requestAnimationFrame(frame);
</script>
<script>
/* ================= SILENT CLOCK (mute/tts builds only) ================= */
(() => {
  const master = document.getElementById('narr');
  if (!master) return;
  // A silent 266 s WAV, generated in memory. It keeps the existing
  // audio.currentTime / play / pause / seek / ended logic fully intact
  // without embedding any narration bytes in the HTML.
  const SR = 8000;                       // 8 kHz mono 16-bit
  const n = Math.ceil(TOTAL * SR);
  const bytes = 44 + n * 2;
  const buf = new ArrayBuffer(bytes);
  const dv = new DataView(buf);
  const put = (off, str) => { for (let i = 0; i < str.length; i++) dv.setUint8(off + i, str.charCodeAt(i)); };
  put(0, 'RIFF');
  dv.setUint32(4, 36 + n * 2, true);
  put(8, 'WAVE');
  put(12, 'fmt ');
  dv.setUint32(16, 16, true);
  dv.setUint16(20, 1, true);             // PCM
  dv.setUint16(22, 1, true);             // mono
  dv.setUint32(24, SR, true);            // sample rate
  dv.setUint32(28, SR * 2, true);        // byte rate
  dv.setUint16(32, 2, true);             // block align
  dv.setUint16(34, 16, true);            // bits per sample
  put(36, 'data');
  dv.setUint32(40, n * 2, true);
  // samples stay zero: silence
  master.src = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  master.load();
  document.documentElement.dataset.audio = 'tts';
})();
</script>
<script>
/* ================= WEB SPEECH API NARRATION (tts build only) ================= */
(() => {
  const TTS_SCENES = [{"id":"intro","text":"Same app. 42 megabytes a decade ago. 256 today. Welcome to The Growing Editor. In this episode, real data answers one question: how exactly did VS Code's installer get this heavy? And along for the ride — Zed, the challenger, for a head-to-head.","audioAt":1.0,"t0":0,"t1":20},{"id":"method","text":"Ground rules first. One yardstick: the Windows x64 installer. For VS Code, we measure the win32-x64 system installer served by the official update server — starting at 1.14, June 2017, the first x64 build you can download — 132 stable releases, patches excluded. For Zed, we read the size field of the Zed-x86_64.exe asset in GitHub Releases — 134 stable releases, starting from 0.208.4 in October 2025. Two caveats: Zed's Windows build is just over a year old, so time ranges aren't comparable; and an installer's size is not the disk footprint after install.","audioAt":21.0,"t0":20,"t1":61},{"id":"timeline","text":"The big picture. 1.14: 42 megabytes. 1.32: first past 50. In 2021, 1.56 hits 80. In 2024, 1.90 crosses 100. And in 2026, things turn vertical — 158 in April, 200 in June, 252 by July. Latest, 1.145: 256.3 megabytes — 6.1 times larger in nine years, about 21 percent a year, up 214. Note the line was gentle until 2026. The cliff comes at the end.","audioAt":62.0,"t0":61,"t1":101},{"id":"spike","text":"Zoom into 2026. Start at 115.8 in October 2025, then 131 in March. April: 1.116 jumps nearly 17. May: two ten-plus jumps. June 24th: 1.126 crosses 200. July 22nd: 1.130 alone adds 36 — through 250. Thirteen months: 115.8 to 256.3. Up 121 percent. VS Code went weekly and shipped more built-in AI and agents — though Microsoft hasn't published an official installer-size breakdown.","audioAt":102.0,"t0":101,"t1":141},{"id":"zed","text":"Now Zed. Pure Rust, native rendering — no Electron, no Chromium. Windows got its first stable build in October 2025: 89.4 megabytes. It peaked at 104.6 in January 2026, then slid back — v1.25.2, October 21st, down 23.8 percent in one go. Latest: 64.8. Net change: down 27.5 percent. VS Code, same window: 115.8 to 256.3 — more than double.","audioAt":142.0,"t0":141,"t1":176},{"id":"why","text":"Why the gap? One: the runtime. VS Code rides on Electron — Chromium plus Node.js — so every Chromium upgrade lifts the whole package. Zed is a native Rust binary; that layer is simply gone. Two: the payload. More AI agents, language services and built-in extensions ship inside the default install. Three: the cadence. Monthly became weekly in 2026 — bytes traded for features. Zed's shrinking proves the trade can go the other way: leaner packaging, on-demand components.","audioAt":177.0,"t0":176,"t1":211},{"id":"board","text":"Scoreboard. 256.3 versus 64.8 megabytes — VS Code is about 3.96 times Zed, a 191.6 megabyte gap. VS Code: 6.1 times in nine years, about 21 percent a year — and more than double this year alone. Zed: down 27.5 percent in one year. Bigger doesn't mean better; smaller doesn't mean weaker. But an installer's size is an honest receipt for every architectural trade-off.","audioAt":212.0,"t0":211,"t1":241},{"id":"outro","text":"Sources: VS Code's official update server and release notes, and Zed's GitHub Releases — measured on November 4th, 2026, all against Windows x64. This is an independent measurement, not affiliated with Microsoft or Zed Industries. Installers are delta-compressed; your disk usage after install will differ. If you found this useful, like, coin and favorite — see you next time.","audioAt":242.0,"t0":241,"t1":266}];
  const master = document.getElementById('narr');
  const muteBtn = document.getElementById('muteBtn');
  const synth = window.speechSynthesis;
  const Utterance = window.SpeechSynthesisUtterance;
  if (!master || !synth || !Utterance){
    document.documentElement.dataset.tts = 'unsupported';
    return;
  }

  let voice = null;
  let lastKey = '';

  function pickVoice(){
    const langOf = v => (v.lang || '').toLowerCase().replace('_', '-');
    const voices = synth.getVoices().filter(v => v && langOf(v).startsWith('en'));
    if (!voices.length) return null;

    // Edge can expose its online neural voices through getVoices() as
    // "Microsoft ... Online (Natural) - English (United States)".
    // Prefer those when the browser makes them available, then fall back
    // to the same local voices used before.
    const online = voices.filter(v => !v.localService || /online|natural/i.test(v.name || ''));
    const onlineUS = online.filter(v => langOf(v).startsWith('en-us'));
    const male = ['guy', 'andrew', 'brian', 'christopher', 'eric', 'roger', 'steffan', 'tony', 'davis', 'jason'];
    const byName = (list, needle) => list.find(v => (v.name || '').toLowerCase().indexOf(needle) !== -1);

    let v = byName(onlineUS, 'guy') || byName(online, 'guy');
    if (!v) v = onlineUS.find(x => male.some(n => (x.name || '').toLowerCase().indexOf(n) !== -1));
    if (!v) v = onlineUS[0] || online[0];

    if (!v){
      for (const name of ['microsoft guy', 'microsoft mark', 'microsoft david', 'google us english', 'samantha', 'alex']){
        v = byName(voices, name);
        if (v) break;
      }
    }
    return v || voices.find(x => langOf(x) === 'en-us') || voices[0];
  }
  function refreshVoice(){
    voice = pickVoice();
    document.documentElement.dataset.voice = voice ? voice.name : 'default';
  }
  refreshVoice();
  if (synth.addEventListener) synth.addEventListener('voiceschanged', refreshVoice);
  else synth.onvoiceschanged = refreshVoice;

  function cancelSpeech(){
    lastKey = '';
    try { synth.cancel(); } catch (e) {}
  }

  function speakScene(sc){
    if (!sc || master.muted) return;
    if (sc.id === lastKey) return;
    lastKey = sc.id;
    try { synth.cancel(); } catch (e) {}
    const u = new Utterance(sc.text);
    u.lang = 'en-US';
    u.rate = 1.08;
    u.pitch = 1;
    u.volume = 1;
    if (voice) u.voice = voice;
    try { synth.speak(u); } catch (e) { lastKey = ''; }
  }

  function activeScene(t){
    // Narration begins at audioAt and must stop at the scene end.
    return TTS_SCENES.find(s => t >= s.audioAt && t < s.t1) || null;
  }

  function sync(){
    // Do not cancel just because the clock is momentarily paused during a
    // seek. Real pause/end/mute are handled by the explicit listeners below.
    if (master.paused || master.ended || master.muted) return;
    const sc = activeScene(master.currentTime || 0);
    if (!sc){
      if (lastKey) cancelSpeech();
      return;
    }
    speakScene(sc);
  }

  master.addEventListener('play', sync);
  master.addEventListener('pause', cancelSpeech);
  // Do not clear lastKey here: the rAF loop may already have spoken the
  // scene at the new position. sync() itself switches scenes when needed.
  master.addEventListener('seeked', sync);
  master.addEventListener('ended', cancelSpeech);

  // The original handler flips master.muted first; this listener runs after it.
  muteBtn.addEventListener('click', () => {
    if (master.muted) cancelSpeech();
    else { lastKey = ''; sync(); }
  });

  window.addEventListener('pagehide', cancelSpeech);
  window.addEventListener('beforeunload', cancelSpeech);

  function loop(){
    sync();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  document.documentElement.dataset.tts = 'ready';
})();
</script>
